name: CI
# يعمل مع كل دفع وطلب دمج: فحص ثابت، بناء، واختبارات المتصفح
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
  compat:
    # التوافقية على محركي Firefox وWebKit (Safari): كل الصفحات على مقاسات الجوال واللوحي والكمبيوتر
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { browser: [firefox, webkit] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/compat.mjs
        env: { BROWSER: '${{ matrix.browser }}' }
  sql:
    # يطبّق الترحيلات على PostgreSQL نظيف ويشغّل اختبارات قاعدة البيانات
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
